[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tbm"
version = "0.1.0"
description = "Transferable Belief Model — belief function algebra"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/tbm"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
